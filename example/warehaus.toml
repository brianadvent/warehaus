# Example warehaus project: a fictional toy shop with two source systems.
# Everything here runs offline; the verify commands only grep local files.

[[areas]]
name = "knowledge"
root = "knowledge"
files = ["*.md"]

[schema]
sots = ["shop-api", "billing-api"]

[adr]
dirs = ["docs/adrs"]

[verify]
timeout = 60

# Generated values: `warehaus stand` runs each command and owns the matching
# <!--gen:id-->...<!--/gen--> range in the claims. Real projects usually also
# set
#
#     [generator]
#     command = "warehaus stand"
#
# so `warehaus verify` can hold generated claims against the collector. The
# example leaves that unset to stay runnable without an installed CLI.

[[stand.values]]
id = "product-catalog-size"
command = 'grep -c "^- SKU " docs/catalog.md'
budget = "free"
