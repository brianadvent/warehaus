name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover tests
      - name: Lint the example project
        run: python -m warehaus --config example/warehaus.toml lint
      - name: Contradiction search on the example project
        run: python -m warehaus --config example/warehaus.toml contradictions
